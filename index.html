const play=document.querySelector('#play'),stage=document.querySelector('#stage'),message=document.querySelector('#message');
const moves={violet:'Chocolate Cyclone',lily:'Sunburst Shuffle',daisy:'Loaf Slide',delilah:'Jazz Pounce',zoey:'Moonbeam Twirl',leo:'Shell Shimmy'};
const actors=[...document.querySelectorAll('.pet')];
let running=false, audio=null, beatTimer=null, beat=0, gainNode=null, volume=.8, battling=false, round=0;
function setActive(on){running=on;document.querySelectorAll('.pet img').forEach(i=>i.style.animationPlayState=on?'running':'paused');document.querySelector('.ball').style.animationPlayState=on?'running':'paused';document.querySelector('.floor').style.animationPlayState=on?'running':'paused';play.textContent=on?'♫ Music playing — tap pets':'▶ Start music + dancing';}
setActive(false);
function createAudio(){
  if(!audio){const Cls=window.AudioContext||window.webkitAudioContext;if(!Cls){message.textContent='Your browser cannot play the generated soundtrack. The dancing still works.';return false;}audio=new Cls();gainNode=audio.createGain();gainNode.gain.value=volume*.42;gainNode.connect(audio.destination);}
  if(audio.state==='suspended')audio.resume().catch(()=>{message.textContent='Audio blocked by this file preview. Open the downloaded HTML in Safari or Chrome, or use the published website.';});
  return true;
}
function beep(freq,time,dur,shape='sine',level=.07){if(!audio||audio.state==='closed')return;const osc=audio.createOscillator(),env=audio.createGain();osc.type=shape;osc.frequency.setValueAtTime(freq,time);env.gain.setValueAtTime(.0001,time);env.gain.exponentialRampToValueAtTime(level,time+.009);env.gain.exponentialRampToValueAtTime(.0001,time+dur);osc.connect(env).connect(gainNode);osc.start(time);osc.stop(time+dur+.02);}
function drums(){if(!running||!audio)return;const t=audio.currentTime+.02;const n=beat%16; // Musical 112 BPM 8th-note rhythm
 if(n%2===0) {beep(60,t,.15,'sine',.25);beep(38,t,.09,'triangle',.15);}
 if(n%4===2){beep(190,t,.07,'square',.035);beep(120,t,.13,'triangle',.09);}
 beep(n%2?880:660,t+.035,.026,'triangle',.022);
 const bass=[110,0,146.83,0,130.81,0,164.81,0,110,0,146.83,0,196,0,164.81,0][n];if(bass)beep(bass,t+.025,.19,'sawtooth',.047);
 if([1,5,9,13].includes(n))beep([329.63,392,440,392][Math.floor(n/4)],t+.07,.12,'sine',.045);
 beat++;
}
function start(){
 const supported=createAudio();setActive(true);
 if(!beatTimer&&supported){drums();beatTimer=setInterval(drums,268);}
 message.textContent= supported?'♫ Dance music started. Click any pet for a solo or tap Dance Off for a competition!':'The dancers are moving. Audio is unavailable in this browser.';
}
function pause(){setActive(false);if(beatTimer){clearInterval(beatTimer);beatTimer=null;}message.textContent='Paused. Press Start to resume.';}
play.addEventListener('click',start);document.querySelector('#off').addEventListener('click',pause);
document.querySelector('#volume').addEventListener('input',e=>{volume=Number(e.target.value)/100;if(gainNode)gainNode.gain.value=volume*.42;if(volume===0)message.textContent='Volume is muted. Slide the sound control to the right to hear music.';});
function sparks(node){const r=node.getBoundingClientRect(),s=stage.getBoundingClientRect();for(let j=0;j<19;j++){let dot=document.createElement('div');dot.className='sparkle';dot.style.left=(r.left-s.left+r.width*.5)+'px';dot.style.top=(r.top-s.top+r.height*.45)+'px';dot.style.setProperty('--dx',((Math.random()-.5)*210)+'px');dot.style.setProperty('--dy',((Math.random()-.5)*210)+'px');stage.appendChild(dot);setTimeout(()=>dot.remove(),1250);}}
function dance(node){node.classList.remove('solo');void node.offsetWidth;node.classList.add('solo');setTimeout(()=>node.classList.remove('solo'),2900);sparks(node);const who=node.dataset.pet;message.innerHTML='<strong>'+who[0].toUpperCase()+who.slice(1)+'</strong> performs the '+moves[who]+'!';}
actors.forEach(b=>b.addEventListener('click',()=>{if(!running)start();dance(b);}));
document.querySelector('#finale').addEventListener('click',()=>{if(!running)start();actors.forEach((node,j)=>setTimeout(()=>dance(node),j*220));});
const battle=document.querySelector('#battle');
battle.addEventListener('click',()=>{
 if(!running)start();if(battling)return;battling=true;round++;battle.disabled=true;battle.textContent='🪩 Dance Off running...';
 const order=[...actors].sort(()=>Math.random()-.5);const winner=order[Math.floor(Math.random()*order.length)];
 message.innerHTML='<strong>🎉 Round '+round+': Dance Off!</strong> Watch all six pets perform!';
 order.forEach((node,j)=>setTimeout(()=>{dance(node);if(j===order.length-1){setTimeout(()=>{
 message.innerHTML='<strong>🏆 Round '+round+' winner: '+winner.dataset.pet.toUpperCase()+'!</strong> '+moves[winner.dataset.pet]+' takes the crown!';
 winner.classList.add('champion');sparks(winner);setTimeout(()=>winner.classList.remove('champion'),2600);
 battle.textContent='🏆 Dance Off Again';battle.disabled=false;battling=false;
 },800);}},j*600));
});
